version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aichat-postgres
    environment:
      POSTGRES_USER: aichat
      POSTGRES_PASSWORD: aichat_dev_password
      POSTGRES_DB: aichat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
